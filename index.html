<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>红包</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 320px;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
        }
        .btn {
            background: #ccc;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 16px;
            color: #fff;
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🧧</div>
        <div class="title">该红包已超过24小时</div>
        <div class="subtitle">红包已被全部领完</div>
        <button class="btn">已领取</button>
    </div>
    <script>
        // 模拟真实红包跳转：3秒后尝试关闭页面
        setTimeout(function() {
            // 微信内置浏览器不支持直接关闭，可以尝试返回上一页
            if (window.WeixinJSBridge) {
                window.WeixinJSBridge.call('closeWindow');
            } else {
                window.close();
            }
        }, 3000);
    </script>
</body>
</html>
